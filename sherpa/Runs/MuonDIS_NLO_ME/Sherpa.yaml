# FIXED-ORDER NLO (parton-level) variant of ../MuonDIS_NLO.
#
# This is NOT "MC@NLO with the shower switched off": MC@NLO subtraction
# terms are defined with respect to the parton shower, so removing the
# shower from an MC@NLO setup leaves an S/H-event mixture that is not a
# well-defined fixed-order prediction. Here instead the genuine fixed-order
# NLO QCD calculation is run: NLO_Mode: Fixed_Order with NLO_Part: BVIRS
# (Born + virtual + integrated CS subtraction + real minus CS subtraction),
# i.e. exactly the object the analytic YADISM NLO curve represents.
#
# Same beams/PDF/EW scheme/selectors/scale as MuonDIS_NLO and MuonDIS_LO_ME.
# Generated in COLLIDER mode in the exact mu-p c.m. frame (sqrt(s)=43.33 GeV);
# Sherpa's Fixed_Target beam mode has a bunch-blob frame bug (charge veto).
# Lab-frame observables are computed as invariants in the analysis script.
BEAMS: [13, 2212]
BEAM_ENERGIES: [21.6438, 21.6641]
PDF_SET: [None, NNPDF40_nnlo_as_01180]
MPI_PDF_SET: NNPDF40_nnlo_as_01180

ME_GENERATORS: [Comix, Amegic, Internal]
RESPECT_MASSIVE_FLAG: true
# benchmark convention (user-fixed 2026-08-13): MASSLESS charm/bottom, they
# stay in the 93 container (ZM), matching the ZM-VFNS YADISM reference.

# parton level: no shower, no beam remnants, no hadronisation, no MPI
SHOWER_GENERATOR: None
FRAGMENTATION: None
BEAM_REMNANTS: false
MI_HANDLER: None

# with no shower the default MEPS/METS scale scheme is unavailable; set
# muF = muR = Q2 = |t| explicitly (p[0] = incoming muon, p[2] = outgoing
# muon, also for the 2->3 real-emission process), identical to the
# "DIS like" branch of the default core scale
# (PHASIC++/Scales/Default_Core_Scale.C)
SCALES: VAR{abs(Abs2(p[0]-p[2]))}

# fixed-order NLO requires weighted events (negative weights, and the RS
# part comes as correlated sub-event lists)
EVENT_GENERATION_MODE: Weighted

PROCESSES:
- 13 93 -> 13 93:
    Order: {QCD: 0, EW: 2}
    NLO_Mode: Fixed_Order
    NLO_Part: BVIRS
    NLO_Order: {QCD: 1, EW: 0}
    ME_Generator: Amegic
    RS_ME_Generator: Comix
    Loop_Generator: Internal
    # converge the steep 1/Q^4 RS channel (as in MuonDIS_NLO)
    Integration_Error: 0.02
    RS_PSI_ItMin: 25000

SELECTORS:
# FASER-motivated DIS cut Q2 > 4 GeV2 and 0.2 < y < 0.9; both are functions
# of the muon momenta only, which the Catani-Seymour mappings in DIS leave
# untouched (initial-final / final-initial dipoles only), so every sub-event
# of a real-emission event carries identical Q2 and y and the cut is exactly
# IR safe -- no cancellation at the cut boundary.
- [Q2, 13, 13, 4, 1e12]
- [INEL, 13, 13, 0.2, 0.9]
