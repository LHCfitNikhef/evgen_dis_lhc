BEAMS: [13, 2112]
BEAM_ENERGIES: [30.6277607, 30.6419867]
PDF_LIBRARY: [None, LHAPDFSherpa]
PDF_SET: [None, NNPDF40_nnlo_as_01180_n]
MPI_PDF_SET: NNPDF40_nnlo_as_01180_n

ME_GENERATORS: [Comix, Amegic, Internal]
RESPECT_MASSIVE_FLAG: true
SHOWER:
  KIN_SCHEME: 1
MI_HANDLER: None

PROCESSES:
- 13 93 -> 13 93:
    Order: {QCD: 0, EW: 2}
    NLO_Mode: MC@NLO
    NLO_Order: {QCD: 1, EW: 0}
    ME_Generator: Amegic
    RS_ME_Generator: Comix
    Loop_Generator: Internal
    # converge the steep 1/Q^4 RS channel: more points per iteration and a
    # real error target (defaults: 1000 points, no target -> 16% error)
    Integration_Error: 0.03
    RS_PSI_ItMin: 25000

SELECTORS:
# Q2 > 4 GeV2, and the W > 3 GeV edge at Q2 = 4 as a y floor (Sherpa
# has no W selector).  No upper y bound.
- [Q2, 13, 13, 4, 1e12]
- [INEL, 13, 13, 0.003229246, 1.0]
