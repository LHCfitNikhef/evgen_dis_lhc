# Region (PRODUCTION.md): Q2 > 4 GeV2 and W > 3 GeV, NO y cut.
# Collider mode in the c.m. frame, beam energies chosen so that
# 2 k.P = 2 E M_P = 3753.088000 GeV2 exactly (target mass 0.939566).
