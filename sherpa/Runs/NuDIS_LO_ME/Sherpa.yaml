# Charged-current neutrino DIS, fixed target: 1 TeV nu_mu beam on proton at
# rest, W exchange, outgoing lepton mu-.  CC counterpart of ../MuonDIS_LO
# (same PDF/cuts/shower/hadronisation conventions, only beam + current change).
# Generated in COLLIDER mode in the exact nu-p c.m. frame (sqrt(s) = 43.32926
# GeV); Sherpa's Fixed_Target beam mode has a bunch-blob frame bug.
# Beam energies are the EXACT c.m. energies of a massless 1 TeV neutrino on a
# proton at rest: E_nu* = (s - m_p^2)/(2 sqrt s), E_p* = (s + m_p^2)/(2 sqrt s)
# with s = m_p^2 + 2 E_nu m_p = 1877.42435 GeV^2, so 2 k.P = 1876.5440 GeV^2
# reproduces the fixed-target invariant exactly (the muon run's energies were
# 0.05% low in sqrt(s); fixed here).
# Lab-frame observables are computed as invariants in the analysis script.
BEAMS: [14, 2212]
BEAM_ENERGIES: [21.654469, 21.674786]
PDF_SET: [None, NNPDF40_nnlo_as_01180]
MPI_PDF_SET: NNPDF40_nnlo_as_01180

# !!! SHERPA NEUTRINO-BEAM FACTOR 2 !!!
# Sherpa 3.0.5 averages over TWO initial-state lepton helicities even for a
# neutrino beam, where only the left-handed state exists.  Its integrator
# sigma is therefore exactly HALF the physical one.  Verified per channel
# against the analytic parton model (analysis/yadism_cc_calc.py):
#   nu_mu d -> mu- u      Sherpa 1.16213 / analytic 2.32583 = 0.4997
#   nu_mu ub -> mu- db    Sherpa 0.06859 / analytic 0.13720 = 0.5000  ((1-y)^2 channel)
#   14 93 -> 13 93        Sherpa 1.59510 / YADISM LO 3.1896 = 0.5001
# whereas the same setup with an e- beam is CORRECT (there the 1/2 average is
# right): e- u -> ve d  Sherpa 2.30761 / analytic 2.30803 = 0.9998.
# BEAM_POLARIZATIONS: [-1, 0] has no effect (bit-identical result).
# The factor is a pure overall normalisation (shape-independent, checked in
# both the flat and the (1-y)^2 channel), applied in analysis/analyze_nu.py
# as SHERPA_NU_SPIN_FACTOR = 2.
ME_GENERATORS: [Comix]
# benchmark convention: MASSLESS charm/bottom (ZM), c/b stay in the 93
# container, as in the muon study.
# Full CKM (default is Order: 0 = unit matrix!) so the charm-production
# fraction matches Pythia/Herwig/YADISM: with a unit CKM the s channel goes
# 100% to charm and the d channel 0%, giving 17% charm instead of 20%.
CKM:
  Order: 3

# ME level: no shower, no beam remnants (also kills intrinsic kT), no
# hadronisation, no MPI -- ME-vs-analytic test of the Q2/x shape
SHOWER_GENERATOR: None
FRAGMENTATION: None
BEAM_REMNANTS: false
MI_HANDLER: None

# with no shower the default MEPS/METS scale scheme is unavailable; set
# muF = muR = Q2 = |t| explicitly (p[0] = nu_mu in, p[2] = mu- out)
SCALES: VAR{abs(Abs2(p[0]-p[2]))}

EVENT_GENERATION_MODE: Weighted

PROCESSES:
- 14 93 -> 13 93:
    Order: {QCD: 0, EW: 2}
    Integration_Error: 0.01

SELECTORS:
# same fiducial region as the muon benchmark: Q2 > 4 GeV2, 0.2 < y < 0.9
- [Q2, 14, 13, 4, 1e12]
- [INEL, 14, 13, 0.2, 0.9]
