# MATRIX-ELEMENT-LEVEL variant of ../MuonDIS_LO (same beams/PDF/cuts/ME,
# reuses its integration grids via Results.zip): shower, beam remnants and
# hadronisation OFF, for the ME-vs-ME comparison against Pythia 8
# (pythia8/dis_mu1TeV_me.cmnd, PartonLevel:all = off).
# Generated in COLLIDER mode in the exact mu-p c.m. frame (sqrt(s)=43.33 GeV);
# Sherpa's Fixed_Target beam mode has a bunch-blob frame bug (charge veto).
# Lab-frame observables are computed as invariants in the analysis script.
BEAMS: [13, 2212]
BEAM_ENERGIES: [21.6438, 21.6641]
PDF_SET: [None, NNPDF40_nnlo_as_01180]
MPI_PDF_SET: NNPDF40_nnlo_as_01180

ME_GENERATORS: [Comix]
# benchmark convention (user-fixed 2026-08-13): MASSLESS charm everywhere.
# c/b stay in the 93 container (ZM). The 2026-08-12 massive convention was
# dropped: Sherpa's Massive:true removes the charm channel entirely, and an
# explicit massive mu c -> mu c process treats the incoming c on-shell
# massive (hard Q2 > ~10, x > 0.03 thresholds, Vegas mapping errors,
# sigma 0.40 nb vs the ACOT-ish 1.4-2.8 nb) -- pathological in 3.0.5.

# ME level: no shower, no beam remnants (also kills intrinsic kT), no
# hadronisation, no MPI
SHOWER_GENERATOR: None
FRAGMENTATION: None
BEAM_REMNANTS: false
MI_HANDLER: None

# with no shower the default MEPS/METS scale scheme is unavailable; set
# muF = muR = Q2 = |t| explicitly, identical to the "DIS like" branch of
# the default core scale (PHASIC++/Scales/Default_Core_Scale.C), so the
# MuonDIS_LO integration grids remain valid
SCALES: VAR{abs(Abs2(p[0]-p[2]))}

EVENT_GENERATION_MODE: Weighted

PROCESSES:
- 13 93 -> 13 93:
    Order: {QCD: 0, EW: 2}
    Integration_Error: 0.02

SELECTORS:
# FASER-motivated DIS cut Q2 > 4 GeV2; y range avoids the low-W region where
# cluster hadronization fails (see MuonDIS_NLO)
- [Q2, 13, 13, 4, 1e12]
- [INEL, 13, 13, 0.2, 0.9]
