# PAPER PLOTS v2 -- GENERATED by tools/make_sherpa_cards.py from
# sherpa/Runs/NuDIS_NLO_ckm3/Sherpa.yaml; edit the generator, not this file.
#
# Charged-current neutrino DIS at NLO QCD (MC@NLO), 2000 GeV nu_mu on a
# PROTON at rest (2212 beam, NNPDF40_nnlo_as_01180).
# Region (PRODUCTION.md): Q2 > 4 GeV2 and W > 3 GeV, NO y cut.
# Collider mode in the c.m. frame, beam energies chosen so that
# 2 k.P = 2 E M_P = 3753.088000 GeV2 exactly (target mass 0.938272).
# Generation cuts: Q2 > 4 and Sherpa INEL y > 0.003229246, the W = 3
# edge at the Q2 floor; looser than W > 3 everywhere above it.  The
# analysis applies the exact W cut (selection q4w3).
#
# ---- below: the v1 template, beams/PDF/selectors replaced ----
BEAMS: [14, 2212]
BEAM_ENERGIES: [30.6276340, 30.6420025]
PDF_SET: [None, NNPDF40_nnlo_as_01180]
MPI_PDF_SET: NNPDF40_nnlo_as_01180

# !!! SHERPA NEUTRINO-BEAM FACTOR 2 — carried over from ../NuDIS_LO !!!
# Sherpa 3.0.5 averages the ME over TWO initial-state lepton helicities even
# for a neutrino beam, where only the left-handed state exists, so its
# integrator sigma is exactly HALF the physical one (verified per channel at
# LO against the analytic parton model; the same setup with an e- beam is
# correct, so it is neutrino-specific, and BEAM_POLARIZATIONS is a no-op
# because the polarisation machinery is dead code).
# AT LO this was measured to be a pure overall normalisation.  It must NOT be
# assumed to carry over to NLO unchecked: the B, V, I and RS pieces each
# average helicities separately.
# THE RIGHT TEST IS A K-FACTOR, NOT A B-ONLY RUN.  A B-only fixed-order run
# would merely reproduce the LO Comix Born (1.59510 pb) and says nothing about
# V/I/RS.  Instead compare Sherpa's INTERNAL K = sigma(NLO)/sigma(LO) against
# YADISM's K_NLO = 3.0464/3.1896 = 0.9551: that ratio is independent of the
# overall factor the spin average introduces, so if the helicity average hit
# B but not V/RS, K would come out far from 0.955.
# Applied downstream in analysis/analyze_nu.py as SHERPA_NU_SPIN_FACTOR = 2.

ME_GENERATORS: [Comix, Amegic, Internal]

# benchmark convention: MASSLESS charm/bottom (ZM), c/b stay in the 93
# container, as in the muon study and ../NuDIS_LO.
#
# >>> FULL CKM, MATCHING ../NuDIS_LO.  This is the point of this run dir. <<<
# ../NuDIS_NLO is forced to Order: 0 because Sherpa's only loop provider in a
# stock build refuses the Cabibbo cross-family channels that a full CKM
# switches on (vmu d -> mu- c and friends), aborting with
#   "Couldn't find virtual ME for this process"
# -- and unit CKM leaves the INCLUSIVE rate right (CKM unitarity, measured
# +0.054%) while getting the charm COMPOSITION wrong by ~3 points, 17% against
# the LO card's correct ~20%.  That made the NLO sample unusable for the CC
# charm strand and not like-for-like with its own LO.
#
# The block was never physics.  The getter in EXTRA_XS/NLO/DY_QCD_Virtual.C
# demanded fl[3].QuarkFamily() == fl[1].QuarkFamily(), but DY_QCD_Virtual::
# Calc() builds its one invariant from the two LEPTON momenta and returns V/B
# -- the universal massless quark-line vertex correction, with every flavour
# and CKM factor sitting in the Born and cancelling in that ratio.  The only
# genuine requirement, massless quarks, is already enforced separately, and
# this benchmark runs a massless (ZM) charm.
# Patched in patches/sherpa-dy-qcd-virtual-ckm.diff; the muon MC@NLO BVI was
# re-integrated with the patched library as a control and moved 34782.3 ->
# 34814.4 pb, i.e. 0.5 sigma on a 44 pb integration error -- consistent with
# zero, as it must be since the neutral current is flavour-diagonal and never
# took that branch.
CKM:
  Order: 3

# !!! SHERPA MASSIVE-PS TRAP — mandatory here !!!
# Sherpa's default RESPECT_MASSIVE_FLAG: false makes ME_Generator_Base::
# SetPSMasses() declare every flavour outside {d,u,s,g,gamma} massive in the
# parton shower whatever the ME did.  In CC neutrino DIS that hits BOTH the
# outgoing mu- and the s->c charm, and at these fixed-target energies the
# ME->shower interface then silently vetoes and regenerates 23% of events,
# deleting the entire charm-producing part of the sample while the
# integrator-normalised sigma_fid still looks perfect.  ../MuonDIS_NLO
# already had this flag set, which is why MC@NLO never showed the bug there.
# CHECK THE LOG: it must read "Massive PS flavours for Comix: (none)" and the
# "From Jet_Evolution:CSS" discard rate must be ~0.
RESPECT_MASSIVE_FLAG: true

SHOWER:
  KIN_SCHEME: 1
MI_HANDLER: None

PROCESSES:
- 14 93 -> 13 93:
    Order: {QCD: 0, EW: 2}
    NLO_Mode: MC@NLO
    NLO_Order: {QCD: 1, EW: 0}
    ME_Generator: Amegic
    RS_ME_Generator: Comix
    # crossed Drell-Yan virtual; for CC this is the W-exchange crossing of
    # the same colour structure the muon NC run used
    Loop_Generator: Internal
    # The muon run needed Integration_Error: 0.03 + RS_PSI_ItMin: 25000 to
    # converge its steep 1/Q^4 photon-pole RS channel.  CC has no such pole
    # (massive W propagator, <Q2> = 155 GeV2 instead of 13), so the same
    # target should be reachable at the LO card's tighter 0.01; the raised
    # RS_PSI_ItMin is kept as cheap insurance.
    Integration_Error: 0.01
    RS_PSI_ItMin: 25000

SELECTORS:
# Q2 > 4 GeV2, and the W > 3 GeV edge at Q2 = 4 as a y floor (Sherpa
# has no W selector).  No upper y bound.
- [Q2, 14, 13, 4, 1e12]
- [INEL, 14, 13, 0.003229246, 1.0]
